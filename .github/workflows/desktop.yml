name: Desktop

on:
  push:
    branches: [master, desktop-ui]
    tags: ["v*"]
    paths: ["apps/desktop/**", "crates/**", "packages/**", "tests/**", "scripts/**", "Cargo.toml", "Cargo.lock", "package.json", ".node-version", ".github/workflows/desktop.yml"]
  pull_request:
    paths: ["apps/desktop/**", "crates/**", "packages/**", "tests/**", "scripts/**", "Cargo.toml", "Cargo.lock", "package.json", ".node-version", ".github/workflows/desktop.yml"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version tag to build and publish
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: desktop-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/desktop/package.json
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            apps/desktop/src-tauri -> target
      - run: cargo test --workspace --manifest-path ../../Cargo.toml --locked -- --test-threads=2
        env:
          SPOOL_INTERACTIVE_ACP: "1"
      - name: Locate native control test executable
        run: |
          $artifacts = cargo test --workspace --manifest-path ../../Cargo.toml --locked --no-run --message-format=json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $binary = $artifacts | ConvertFrom-Json | Where-Object {
            $_.reason -eq "compiler-artifact" -and $_.target.name -eq "spool" -and $_.profile.test -and $_.executable
          } | Select-Object -First 1 -ExpandProperty executable
          if (-not $binary -or -not (Test-Path -LiteralPath $binary)) { throw "Native control test executable was not built." }
          "SPOOL_CONTROL_TEST_BINARY=$binary" >> $env:GITHUB_ENV
      - run: cargo build --manifest-path ../../Cargo.toml --locked
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir ../../packages/runners install --frozen-lockfile
      - run: pnpm --dir ../../packages/runners test
        timeout-minutes: 20
      - run: node --test ../../packages/runners/bridge/test/native-message-integration.test.mjs
        env:
          SPOOL_TEST_BINARY: ${{ github.workspace }}\target\debug\spool.exe
      - run: pnpm verify:publication
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: pnpm test:desktop
      - run: pnpm test
      - run: pnpm exec playwright install chromium
      - run: pnpm test:web
        env:
          SPOOL_TEST_RUNNERS_HOME: ${{ github.workspace }}/packages/runners
      - run: pnpm build-storybook
      - name: Build desktop installer
        run: |
          if ($env:TAURI_SIGNING_PRIVATE_KEY) {
            pnpm desktop:build
          } else {
            pnpm prepare:desktop
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            pnpm desktop build --config '{"bundle":{"createUpdaterArtifacts":false}}'
          }
          exit $LASTEXITCODE
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: Spool-Windows-x64
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/nsis/*.sig
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - uses: actions/download-artifact@v4
        with:
          name: Spool-Windows-x64
          path: installers
      - name: Publish installer and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          node apps/desktop/scripts/release-manifest.mjs installers "$TAG" "$GH_REPO"
          cd installers
          sha256sum *.exe > SHA256SUMS.txt
          gh release create "$TAG" *.exe *.sig latest.json SHA256SUMS.txt --verify-tag --title "Spool $TAG" --generate-notes
