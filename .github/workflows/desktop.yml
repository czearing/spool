name: Desktop

on:
  push:
    branches: [master, desktop-ui]
    tags: ["v*"]
    paths: ["desktop/**", "packages/workflow/**", ".github/workflows/desktop.yml"]
  pull_request:
    paths: ["desktop/**", "packages/workflow/**", ".github/workflows/desktop.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: desktop/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify:publication
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: pnpm test
      - run: pnpm test:desktop
      - run: pnpm desktop:build
      - uses: actions/upload-artifact@v4
        with:
          name: Spool-Windows-x64
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Spool-Windows-x64
          path: installers
      - name: Publish installer and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          cd installers
          sha256sum *.exe > SHA256SUMS.txt
          gh release create "$TAG" *.exe SHA256SUMS.txt --verify-tag --title "Spool $TAG" --generate-notes
