name: Feature request
description: Describe a workflow Spool could improve.
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or workflow
      description: Explain what you are trying to do and where Spool gets in the way.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed improvement
      description: Describe the smallest change that would solve the problem.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Include existing workflows or workarounds, if any.
